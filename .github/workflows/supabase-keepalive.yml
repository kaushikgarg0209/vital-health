name: Supabase keep-alive

on:
  schedule:
    # Every 3 days at 09:00 UTC (2:30 PM IST)
    - cron: "0 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint (with retry for Render cold start)
        env:
          HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          set -uo pipefail

          if [ -z "${HEALTH_URL:-}" ]; then
            echo "::error::RENDER_HEALTH_URL secret is not set."
            echo "Add it in GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi

          MAX_ATTEMPTS=3
          RETRY_DELAY=90

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Attempt ${attempt}/${MAX_ATTEMPTS}: GET ${HEALTH_URL}"

            HTTP_CODE="000"
            if curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 120 "$HEALTH_URL" > /tmp/http_code.txt; then
              HTTP_CODE="$(cat /tmp/http_code.txt)"
            fi

            echo "HTTP ${HTTP_CODE}"
            if [ -f /tmp/health.json ]; then
              echo "Response body:"
              cat /tmp/health.json
              echo
            fi

            if [ "$HTTP_CODE" = "200" ]; then
              STATUS="$(jq -r '.status // empty' /tmp/health.json 2>/dev/null || true)"
              DB_STATUS="$(jq -r '.checks.database.status // empty' /tmp/health.json 2>/dev/null || true)"

              if [ "$STATUS" = "ok" ] && [ "$DB_STATUS" = "ok" ]; then
                echo "Health check passed (status=ok, database=ok)."
                exit 0
              fi

              echo "Unhealthy response: status=${STATUS}, database=${DB_STATUS}"
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Retrying in ${RETRY_DELAY}s (Render may be waking from sleep)..."
              sleep "$RETRY_DELAY"
            fi
          done

          echo "::error::Health check failed after ${MAX_ATTEMPTS} attempts."
          echo "If database checks failed, resume Supabase in the dashboard and re-run this workflow."
          exit 1
